<h1 mat-dialog-title>Login required.</h1>
<div mat-dialog-content>     
  <p>You have to log in to get permission to the site.</p>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="loginWithDiscord()">Login via Discord</button>
  or/and via Google, both is required
  <button mat-button (click)="reject()">Reject</button>
</div>
