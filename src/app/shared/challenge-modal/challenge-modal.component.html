<h2 mat-dialog-title>Challenge Clan</h2>
<mat-dialog-content>
  <p>You are challenging: <strong>{{ data.challengedClan.clan }}</strong></p>
  <mat-form-field>
    <mat-label>Select the challenging clan</mat-label>
    <mat-select [(ngModel)]="selectedChallenger">
      <mat-option *ngFor="let clan of filteredClans" [value]="clan.clan">
        {{ clan.clan }}
      </mat-option>
    </mat-select>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-button (click)="onSubmit()">Challenge</button>
</mat-dialog-actions>
