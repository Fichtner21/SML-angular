              </button>
            </div>

    <div *ngIf="last10mixes.length" class="mixes">
      <h3>Last 10 Mixes</h3>
      <div class="selected-cont">
        <div *ngFor="let mixes of last10mixes; let i = index;" class="selected">          
          <div class="selectedPlayer">
            <div class="number">{{ i + 1 }}</div>
            <!-- Iteracja po graczach w miksie -->
            <div class="mix-cont">
              <div *ngFor="let mix of mixes; let i = index;" class="mix">
                <div class="createdAt" *ngIf="i === 0"> <!-- Sprawdzenie, czy to pierwszy element -->
                  {{ mix.createdAt | date:'dd.MM.yyyy HH:mm'}} <!-- Wyświetlenie createdAt tylko dla pierwszego elementu -->
                </div>
                <div class="team">
                  <div class="player" [ngClass]="{ 'teamOne': mix.team === 1, 'teamTwo': mix.team === 2}">
                    <span>{{ mix.playername }}</span>
                    <img [src]="'assets/images/flags_svg/' + mix.flag + '.SVG'">
                  </div>                
                </div>
              </div>
            </div>
            
    
            <!-- Przycisk dodawania wszystkich graczy do formularza -->
            <div class="addToForm">
              <button mat-raised-button type="button" class="submit" color="accent" (click)="addAllPlayersToForm(mixes)">Add to Form</button> 
            </div>
          </div>
        </div>        
      </div>
    </div>

  <notifier-container></notifier-container>
